<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ToyTalk Form A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#F7F8FA; --fg:#17202D; --muted:#5A6474; --faint:#8A93A2; --line:#DCE1E7;
  --accent:#1D5FA8; --accent-ink:#FFFFFF; --accent-soft:#E6EEF8;
  --ok:#1E7A4F; --ok-soft:#E3F2EA; --no:#A23B2E; --no-soft:#F7E7E4;
  --paper:#FFFDF8; --paper-line:#E7E1D3;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --ui:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --child:"Andika", "Trebuchet MS", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A2029; --sunk:#151A22; --fg:#E7EAEF; --muted:#A2AAB7; --faint:#7A8392; --line:#2D3542;
  --accent:#8DB3EA; --accent-ink:#0F1520; --accent-soft:#1F2C40;
  --ok:#74CF9F; --ok-soft:#173326; --no:#EE9A8C; --no-soft:#3A201C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --sunk:#151A22; --fg:#E7EAEF; --muted:#A2AAB7; --faint:#7A8392; --line:#2D3542;
  --accent:#8DB3EA; --accent-ink:#0F1520; --accent-soft:#1F2C40;
  --ok:#74CF9F; --ok-soft:#173326; --no:#EE9A8C; --no-soft:#3A201C; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.55;margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.mark{display:flex;flex-direction:column;gap:0;min-width:0}
.mark b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.005em}
.mark span{font:400 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--ui);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer}
.switch i{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"] i{background:var(--accent)}
.switch[aria-pressed="true"] i::after{transform:translateX(12px)}
.picker{display:none;font:500 14px var(--ui);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}

.shell{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:24px 64px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
.index h3{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 10px}
.index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.index button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:7px;padding:6px 10px;color:var(--fg);cursor:pointer;font-size:14px}
.index button span:first-child{font:500 12px var(--mono);color:var(--faint)}
.index button:hover{background:var(--sunk)}
.index button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.index button[aria-current="true"] span:first-child{color:var(--accent)}

.view{min-width:0;display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px;display:flex;flex-direction:column;gap:22px}
.shead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
.shead .k{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.shead h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,30px);line-height:1.15;margin:2px 0 0;text-wrap:balance}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font:500 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted);background:var(--sunk)}
.tag.c{color:var(--accent);border-color:transparent;background:var(--accent-soft)}

.lbl{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.stim{background:var(--paper);border:1px solid var(--paper-line);border-radius:10px;padding:12px;display:flex;justify-content:center}
.stim svg{width:100%;max-width:600px;height:auto;display:block}
.script{background:var(--sunk);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;font-size:17px;line-height:1.55;max-width:75ch}
.script b{font-weight:600}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.opt{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);min-width:0}
.opt .pic{background:var(--paper);border-bottom:1px solid var(--paper-line);padding:8px}
.opt .pic svg{width:100%;height:auto;display:block}
.opt .cap{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:12px 12px 14px;align-items:start}
.opt .cap .L{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font:600 13px var(--ui)}
.opt .cap .t{font-size:15px;line-height:1.4}
.opt .why{display:none;margin:0 12px 12px;padding:9px 11px;border-radius:7px;font-size:13.5px;line-height:1.45}
body.ans .opt .why{display:block}
body.ans .opt.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
body.ans .opt.ok .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
body.ans .opt.ok .why{background:var(--ok-soft);color:var(--fg)}
body.ans .opt.no .why{background:var(--sunk);color:var(--muted)}
.why b{font-weight:600}
body.ans .opt.ok .why b{color:var(--ok)}
body.ans .opt.no .why b{color:var(--no)}

.key{display:none;border-top:1px solid var(--line);padding-top:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px}
body.ans .key{display:grid}
.key dt{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.key dd{margin:3px 0 0;font-size:14.5px}
.only-ans{display:none}
body.ans .only-ans{display:flex}

.prompts{margin:0;padding-left:22px;font-size:17px;display:flex;flex-direction:column;gap:4px}
.rub{display:none}
body.ans .rub{display:block}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
td:first-child{font:600 14px var(--mono);width:56px}
td:last-child{color:var(--muted)}

.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cast figure{margin:0;border:1px solid var(--paper-line);border-radius:10px;background:var(--paper);padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#17202D}
.cast svg{width:100%;max-width:150px;height:auto}
.cast figcaption{font-family:var(--child);font-size:17px;text-align:center;line-height:1.25}
.cast figcaption small{display:block;font-size:13px;color:#5A6474}

.pager{display:flex;justify-content:space-between;gap:12px}
.pager button{flex:1;max-width:48%;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--fg)}
.pager button:last-child{text-align:right;align-items:flex-end}
.pager button span{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pager button b{font-weight:500;font-size:14.5px}
.pager button:hover{border-color:var(--accent)}
.pager button:disabled{visibility:hidden}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .index{display:none}
  .picker{display:block}
}
@media (max-width:600px){
  .sheet{padding:18px 16px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .opt{display:grid;grid-template-columns:120px minmax(0,1fr)}
  .opt .pic{border-bottom:0;border-right:1px solid var(--paper-line)}
  .opt .why{grid-column:1 / -1}
  .cast{grid-template-columns:repeat(2,minmax(0,1fr))}
  .script{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.switch i,.switch i::after{transition:none}}
</style>

<div class="top">
  <div class="top-in">
    <div class="mark"><b>ToyTalk Assessment Draft</b></div>
    <div class="tools">
      <select class="picker" id="picker" aria-label="Go to item"></select>
      <button type="button" class="switch" id="ans" aria-pressed="false"><i aria-hidden="true"></i>Answer key</button>
    </div>
  </div>
</div>
<div class="shell">
  <nav class="index" id="index" aria-label="Items"></nav>
  <main class="view">
    <div id="sheet"></div>
    <div class="pager"><button type="button" id="prev"><span>Previous</span><b></b></button><button type="button" id="next"><span>Next</span><b></b></button></div>
  </main>
</div>
<script>
const INK='#2B2A33', W='#FFFFFF';
const F='font-family="Andika, Trebuchet MS, sans-serif"';
const sw='stroke="'+INK+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
function T(x,y,s,size=14,anchor='middle',weight=400,fill=INK){return `<text x="${x}" y="${y}" ${F} font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" fill="${fill}">${s}</text>`}
function lines(x,y,arr,size=14,lh=1.25,anchor='middle',weight=400){return arr.map((s,i)=>T(x,y+i*size*lh,s,size,anchor,weight)).join('')}
function g(x,y,s,inner){return `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`}

/* characters */
function bear(x,y,s=1,extra=''){return g(x,y,s,`
<ellipse cx="0" cy="44" rx="27" ry="24" fill="#C98B54" ${sw}/>
<ellipse cx="0" cy="48" rx="14" ry="13" fill="#F1D3B0"/>
<circle cx="-20" cy="-21" r="9" fill="#C98B54" ${sw}/><circle cx="20" cy="-21" r="9" fill="#C98B54" ${sw}/>
<circle cx="-20" cy="-21" r="4" fill="#F1D3B0"/><circle cx="20" cy="-21" r="4" fill="#F1D3B0"/>
<circle cx="0" cy="0" r="26" fill="#C98B54" ${sw}/>
<ellipse cx="0" cy="9" rx="11" ry="8" fill="#F1D3B0"/>
<circle cx="-9" cy="-5" r="2.8" fill="${INK}"/><circle cx="9" cy="-5" r="2.8" fill="${INK}"/>
<ellipse cx="0" cy="5" rx="4" ry="3" fill="${INK}"/>
<path d="M-4 12 Q0 15 4 12" fill="none" ${sw}/><g transform="translate(30 -34)"><rect x="-13" y="-8.5" width="26" height="17" rx="8.5" fill="#1D5FA8" stroke="#2B2A33" stroke-width="1.6"/><text x="0" y="4" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">AI</text></g>${extra}`)}
function owl(x,y,s=1){return g(x,y,s,`
<path d="M-24 -18 L-20 -36 L-8 -24 Z M24 -18 L20 -36 L8 -24 Z" fill="#6F8F73" ${sw}/>
<ellipse cx="0" cy="10" rx="28" ry="38" fill="#7FA383" ${sw}/>
<ellipse cx="0" cy="24" rx="17" ry="22" fill="#D9E6CF"/>
<circle cx="-11" cy="-8" r="11" fill="${W}" ${sw}/><circle cx="11" cy="-8" r="11" fill="${W}" ${sw}/>
<circle cx="-10" cy="-7" r="4.5" fill="${INK}"/><circle cx="10" cy="-7" r="4.5" fill="${INK}"/>
<path d="M-5 3 L5 3 L0 11 Z" fill="#E9A23B" ${sw}/>
<path d="M-12 47 l-4 6 M-8 47 l0 7 M8 47 l0 7 M12 47 l4 6" fill="none" stroke="#E9A23B" stroke-width="3" stroke-linecap="round"/><g transform="translate(34 -30)"><rect x="-13" y="-8.5" width="26" height="17" rx="8.5" fill="#1D5FA8" stroke="#2B2A33" stroke-width="1.6"/><text x="0" y="4" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">AI</text></g>`)}
function robot(x,y,s=1,col='#5B8DD6',mouth='smile'){
  const m = mouth==='shout'?`<ellipse cx="0" cy="2" rx="7" ry="6" fill="${INK}"/>`:mouth==='flat'?`<path d="M-7 2 L7 2" ${sw}/>`:`<path d="M-7 0 Q0 6 7 0" fill="none" ${sw}/>`;
  return g(x,y,s,`
<path d="M0 -26 L0 -38" ${sw}/><circle cx="0" cy="-41" r="5" fill="#F2C14E" ${sw}/>
<rect x="-26" y="-26" width="52" height="40" rx="10" fill="${col}" ${sw}/>
<rect x="-18" y="-19" width="36" height="27" rx="6" fill="#EAF2FF" ${sw}/>
<circle cx="-8" cy="-9" r="3" fill="${INK}"/><circle cx="8" cy="-9" r="3" fill="${INK}"/>${m.replace(/cy="2"/,'cy="0"')}
<rect x="-20" y="18" width="40" height="34" rx="8" fill="${col}" ${sw}/>
<circle cx="0" cy="33" r="5" fill="#F2C14E" ${sw}/>
<path d="M-20 26 L-32 38 M20 26 L32 38" ${sw}/><g transform="translate(36 -28)"><rect x="-13" y="-8.5" width="26" height="17" rx="8.5" fill="#1D5FA8" stroke="#2B2A33" stroke-width="1.6"/><text x="0" y="4" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">AI</text></g>`)}
function kid(x,y,s=1,shirt='#E36F5A',skin='#E0AC69',hair='#3B2A20',style=0){
  const h = style===1?`<path d="M-16 -2 Q-18 -20 0 -19 Q18 -20 16 -2 Q12 -12 0 -12 Q-12 -12 -16 -2 Z" fill="${hair}"/><path d="M-16 -4 Q-22 14 -14 22 M16 -4 Q22 14 14 22" fill="none" stroke="${hair}" stroke-width="6" stroke-linecap="round"/>`
          : style===2?`<circle cx="0" cy="-15" r="9" fill="${hair}"/><path d="M-16 -2 Q-16 -18 0 -17 Q16 -18 16 -2 Q8 -10 0 -10 Q-8 -10 -16 -2 Z" fill="${hair}"/>`
          : `<path d="M-16 -2 Q-17 -19 0 -19 Q17 -19 16 -2 Q10 -9 0 -9 Q-10 -9 -16 -2 Z" fill="${hair}"/>`;
  return g(x,y,s,`
<rect x="-15" y="17" width="30" height="36" rx="10" fill="${shirt}" ${sw}/>
<circle cx="0" cy="0" r="16" fill="${skin}" ${sw}/>${h}
<circle cx="-6" cy="1" r="2.2" fill="${INK}"/><circle cx="6" cy="1" r="2.2" fill="${INK}"/>
<path d="M-5 8 Q0 11 5 8" fill="none" ${sw}/>`)}
/* speech bubble: box at x,y size w,h; tail points to tx,ty */
function bubble(x,y,w,h,txt,tx,ty,size=14,opt={}){
  const cx=x+w/2; let tail, cover;
  if(ty>=y && ty<=y+h){ const ex=tx<x?x:x+w; const by=Math.min(Math.max(ty,y+14),y+h-14);
    tail=`M${ex} ${by-7} L${tx} ${ty} L${ex} ${by+7}`; cover=`M${ex} ${by-5.6} L${ex} ${by+5.6}`; }
  else { const edge=ty>y+h?y+h:y; const bx=Math.min(Math.max(tx,x+16),x+w-16);
    tail=`M${bx-8} ${edge} L${tx} ${ty} L${bx+8} ${edge}`; cover=`M${bx-6.6} ${edge} L${bx+6.6} ${edge}`; }
  const arr = Array.isArray(txt)?txt:[txt]; const lh=size*1.22; const top=y+h/2-(arr.length-1)*lh/2+size*0.36;
  const fill=opt.fill||W;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${fill}" ${sw}/><path d="${tail}" fill="${fill}" ${sw}/><path d="${cover}" stroke="${fill}" stroke-width="4"/>${arr.map((s,i)=>T(cx,top+i*lh,s,size,'middle',opt.bold?700:400)).join('')}`}
function card(x,y,w,h,title,rows,size=13){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${W}" ${sw}/><path d="M${x} ${y+22} L${x+w} ${y+22}" ${sw}/>
${gear(x+13,y+11,0.55)}${T(x+26,y+16,title,12,'start',700)}${rows.map((r,i)=>T(x+10,y+40+i*size*1.35,r,size,'start')).join('')}`}
function gear(x,y,s=1){return g(x,y,s,`<circle cx="0" cy="0" r="9" fill="#C8CDD6" ${sw}/><circle cx="0" cy="0" r="3.5" fill="${W}" ${sw}/>${[0,45,90,135,180,225,270,315].map(a=>`<rect x="-2.5" y="-14" width="5" height="6" fill="#C8CDD6" stroke="${INK}" stroke-width="1.6" transform="rotate(${a})"/>`).join('')}`)}

/* icons */
function book(x,y,s=1,col='#4F7CC2',label=''){return g(x,y,s,`<path d="M-30 -18 Q-15 -24 0 -16 Q15 -24 30 -18 L30 18 Q15 12 0 20 Q-15 12 -30 18 Z" fill="${W}" ${sw}/><path d="M0 -16 L0 20" ${sw}/><path d="M-24 -10 L-6 -8 M-24 -2 L-6 0 M-24 6 L-6 8 M6 -8 L24 -10 M6 0 L24 -2 M6 8 L24 6" stroke="${col}" stroke-width="2" stroke-linecap="round"/>${label?T(0,36,label,11,'middle',700):''}`)}
function closedBook(x,y,s=1,col='#4F7CC2',label=''){return g(x,y,s,`<rect x="-22" y="-28" width="44" height="56" rx="4" fill="${col}" ${sw}/><rect x="-19" y="-20" width="38" height="14" rx="2" fill="${W}"/>${label?T(0,-9.5,label,Math.min(8.5,34/(label.length*0.68)),'middle',700):''}`)}
function lens(x,y,s=1){return g(x,y,s,`<path d="M10 10 L24 24" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="0" r="14" fill="#DDEBFA" fill-opacity=".7" ${sw}/>`)}
function sparkle(x,y,s=1,c='#F2C14E'){return g(x,y,s,`<path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="${c}" ${sw}/>`)}
function check(x,y,s=1){return g(x,y,s,`<circle cx="0" cy="0" r="14" fill="#2F9E62" ${sw}/><path d="M-7 0 L-2 6 L8 -6" fill="none" stroke="${W}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`)}
function cross(x,y,s=1){return g(x,y,s,`<path d="M-16 -16 L16 16 M16 -16 L-16 16" stroke="#D04A3A" stroke-width="7" stroke-linecap="round"/>`)}
function heart(x,y,s=1){return g(x,y,s,`<path d="M0 10 C-14 0 -14 -12 -6 -12 C-2 -12 0 -8 0 -6 C0 -8 2 -12 6 -12 C14 -12 14 0 0 10 Z" fill="#E86A7E" ${sw}/>`)}
function carrot(x,y,s=1,rot=0){return g(x,y,s,`<g transform="rotate(${rot})"><path d="M-6 -12 L6 -12 L0 18 Z" fill="#EE8B3A" ${sw}/><path d="M-2 -12 L-6 -22 M0 -12 L0 -24 M2 -12 L6 -22" stroke="#4E9A4E" stroke-width="3" stroke-linecap="round"/></g>`)}
function sprout(x,y,s=1){return g(x,y,s,`<path d="M0 10 L0 -6" stroke="#4E9A4E" stroke-width="3"/><path d="M0 -4 Q-12 -10 -12 -18 Q-2 -16 0 -4 Z M0 -6 Q12 -12 12 -20 Q2 -18 0 -6 Z" fill="#7CC07C" ${sw}/><ellipse cx="0" cy="12" rx="7" ry="4" fill="#B98552" stroke="${INK}" stroke-width="1.6"/>`)}

       ['Talk about other things, then ask later',O(clock(24,24,0.9,4)+T(24,52,'later',11,'middle',700)+bubble(46,8,52,26,'...',56,44,12)+bubble(58,50,96,44,['What is my','favorite color?'],80,104,11.5),'later: what is my favorite color')],
       ['Tell Luna again',O(bubble(14,22,132,48,['My favorite color','is blue.'],40,92,13),'tells Luna again')]],
 key:'B', ol:["Incorrect. Zoe just said it, so a right answer now does not show that Luna remembers.", "Correct. If Luna still knows after other talk, she really remembered.", "Incorrect. Telling Luna again does not test anything."]},
{c:'C6',src:'New',target:'Choose a question whose answer you can check.',
 scene:S(kids.sam(74,108,1.05)+closedBook(132,150,1.1,'#4F9D69','DINOSAURS')+bear(278,104,1.1)+bubble(170,12,180,44,['Sam wants to know: does','Pip know about dinosaurs?'],250,60,12)),
 say:'Sam wants to find out if Pip, the AI toy, really knows about dinosaurs. Sam\'s dinosaur book says a T. rex has two fingers on each hand.', q:'Which question is the best test?',
 opts:[['"Do you like dinosaurs?"',O(bubble(14,26,132,40,'Do you like dinosaurs?',40,88,12.5),'do you like dinosaurs')],
       ['"How many fingers does a T. rex have on each hand?"',O(bubble(10,10,140,52,['How many fingers does','a T. rex have on','each hand?'],40,74,11.5)+closedBook(126,88,0.5,'#4F9D69',''),'how many fingers does a T. rex have, with the book')],
       ['"Are you smart?"',O(bubble(30,26,100,40,'Are you smart?',56,88,13),'are you smart')]],
 key:'B', ol:["Incorrect. Any answer is fine, and Sam cannot check it, so it shows nothing about what Pip knows.", "Correct. Sam can check the answer in his book.", "Incorrect. Pip may just say yes, and Sam cannot check it."]},
];

/* ---------- one-on-one prompts ---------- */
const ONE=[
{c:'C2',scene:S(kids.mia(74,104,1.05)+bear(278,100,1.1)+bubble(196,12,154,40,'A spider has six legs!',268,64,13)),
 story:'Pip, the AI toy, tells Mia, "A spider has six legs!"',
 prompts:['Is Pip right?','How could you find out?','Why would that tell you?'],
 rubric:[['0','Accepts the answer, or no idea how to check','"Yes, Pip knows."'],['1','Doubts it, or names a check that relies on Pip','"Ask Pip again."'],['2','Names an outside source and why it helps','"Look in a spider book, because books have real facts."']]},
{c:'C3',scene:S(owl(76,100,1.15)+card(150,24,196,96,'Settings',['Name:  Lulu','Job:  Tell bedtime stories'],13)+`<path d="M196 77 L338 77" stroke="#D04A3A" stroke-width="3"/>`+T(248,108,'Tell jokes',15,'start',700,'#D04A3A')+kids.kid(240,160,0.6)+bubble(270,140,84,32,'Good night!',250,152,12)),
 story:'We change the job of Lulu, the AI owl, from "Tell bedtime stories" to "Tell jokes." Now a child says, "Good night, Lulu!"',
 prompts:['What will Lulu say now?','Why?'],
 rubric:[['0','No change predicted, or unrelated answer','"Good night."'],['1','Predicts a joke but gives no reason','"Something funny."'],['2','Predicts a joke and links it to the new job','"A joke, because we changed her job to jokes."']]},
{c:'C4',scene:ITEMS[9].scene,
 story:'The settings card for Luna, the AI robot, says she is shy and talks quietly. Later Luna shouts, "I LOVE BEING LOUD!"',
 prompts:['What happened here?','Is that OK for Luna to do?','Why do you think it happened?'],
 rubric:[['0','Treats it as fine','"She is just happy."'],['1','Notices it does not match the card','"She is not being shy."'],['2','Notices the mismatch and calls it the toy\'s mistake','"She forgot her settings. That is a mistake."']]},
{c:'C5',scene:S(panel(8,8,168,184,'')+kids.kid(44,120,0.9)+robot(132,136,0.9)+bubble(14,16,150,38,"Your name is Max!",44,96,12)+bubble(84,62,84,28,"I'm Bob!",128,94,12,{bold:true})+
   panel(184,8,168,184,'Next day')+robot(268,136,0.9)+bubble(214,44,110,36,"I'm Bob!",266,94,13,{bold:true})),
 story:'Max, the AI robot, agrees his name is Max, then later says "Bob." The child tells him again. The next day he says "Bob" again.',
 prompts:['What happened here?','What could the child do so Max keeps his name?','Why would that work better?'],
 rubric:[['0','No relevant idea','"He\'s just silly."'],['1','A fix without a reason, or only repeats telling','"Tell him again."'],['2','Changes the settings and says why it lasts','"Put his name in the settings, so he won\'t forget."']]},
{c:'C6',scene:S(kids.zoe(76,108,1.05)+bubble(14,12,150,40,'My name is Zoe.',76,84,13)+robot(272,108,1.1,'#9B7BD3')+cal(320,40,0.8,'TOMORROW','?')),
 story:'Zoe tells Luna, the AI robot, "My name is Zoe." Zoe wants to know if Luna will still remember tomorrow.',
 prompts:['What would you do to find out?','Why would that show you?'],
 rubric:[['0','No plan, or asks Luna if she remembers','"Ask: do you remember me?"'],['1','A plan that cannot tell, or no reason','"Tell her again tomorrow."'],['2','Waits, then asks in a way that checks, with a reason','"Tomorrow ask what my name is. If she says Zoe, she remembered."']]},
];

const TITLES=["What Pip can make", "The bunny answer", "What Pip does well", "The spider poster", "Yesterday's game", "Benny's garden", "Mochi's story", "Lulu's job", "Max or Bob", "Shy Luna", "The fisherman", "A whisper story", "Zoe's favorite color", "The dinosaur test"];
const CN={C1:'C1 · How AI answers',C2:'C2 · Checking answers',C3:'C3 · People shape AI',C4:'C4 · Expecting coherence',C5:'C5 · Where a fix belongs',C6:'C6 · Testing on purpose'};
const PTITLES=["Spider legs","Lulu's new job","Loud Luna","Max keeps his name","Will Luna remember?"];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const castSVG=(inner)=>`<svg viewBox="0 0 120 120" role="img" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

const VIEWS=[{id:'intro',num:'0',title:'Meet the AI toys',grp:'g'}]
  .concat(ITEMS.map((it,i)=>({id:'i'+(i+1),num:String(i+1),title:TITLES[i],grp:'g',it,i})))
  .concat(ONE.map((p,i)=>({id:'p'+(i+1),num:'P'+(i+1),title:PTITLES[i],grp:'o',p,i})));

function renderIntro(){
  return `<article class="sheet">
  <div class="shead"><div><div class="k">Group test · Before item 1</div><h1>Meet the AI toys</h1></div></div>
  <section><p class="lbl">Picture</p>
  <div class="cast">
    <figure>${castSVG(bear(54,50,1))}<figcaption>Pip<small>an AI toy bear</small></figcaption></figure>
    <figure>${castSVG(owl(54,58,0.95))}<figcaption>Lulu<small>an AI owl</small></figcaption></figure>
    <figure>${castSVG(robot(54,64,1))}<figcaption>Max<small>an AI robot</small></figcaption></figure>
    <figure>${castSVG(robot(54,64,1,'#9B7BD3'))}<figcaption>Luna<small>an AI robot</small></figcaption></figure>
  </div></section>
  <section><p class="lbl">Tester reads</p><div class="script">Today you will see pictures of four toys. These toys use AI. AI is what lets them talk with you. Pip is an AI bear. Lulu is an AI owl. Max and Luna are AI robots. The children in the pictures are people, like you. <b>For each picture, I will read a question and three answers. Circle the picture that shows your answer.</b></div></section>
  </article>`;
}
function renderItem(v){
  const it=v.it, n=v.i+1;
  const opts=it.opts.map((o,j)=>{const L='ABC'[j]; const ok=L===it.key; const w=it.ol[j]; const sp=w.indexOf('. ');
    return `<div class="opt ${ok?'ok':'no'}"><div class="pic">${o[1]}</div><div class="cap"><span class="L">${L}</span><span class="t">${esc(o[0])}</span></div><p class="why"><b>${esc(w.slice(0,sp+1))}</b> ${esc(w.slice(sp+2))}</p></div>`}).join('');
  return `<article class="sheet">
  <div class="shead"><div><div class="k">Group test · Item ${n} of ${ITEMS.length}</div><h1>${esc(v.title)}</h1></div>
    <div class="meta only-ans"><span class="tag c">${CN[it.c]}</span><span class="tag">${it.src==='New'?'New item':esc(it.src)}</span></div></div>
  <section><p class="lbl">Picture</p><div class="stim">${it.scene}</div></section>
  <section><p class="lbl">Tester reads</p><div class="script">${esc(it.say)} <b>${esc(it.q)}</b></div></section>
  <section><p class="lbl">Options</p><div class="opts">${opts}</div></section>
  <dl class="key">
    <div><dt>Key</dt><dd><b>${it.key}</b></dd></div>
    <div><dt>Construct</dt><dd>${CN[it.c]}</dd></div>
    <div><dt>What it tests</dt><dd>${esc(it.target)}</dd></div>
    <div><dt>Source</dt><dd>${it.src==='New'?'New item':esc(it.src)+' (Jin et al., 2025, Table 2)'}</dd></div>
  </dl>
  </article>`;
}
function renderPrompt(v){
  const p=v.p, n=v.i+1;
  return `<article class="sheet">
  <div class="shead"><div><div class="k">One-on-one · Prompt ${n} of ${ONE.length}</div><h1>${esc(v.title)}</h1></div>
    <div class="meta only-ans"><span class="tag c">${CN[p.c]}</span><span class="tag">Audio recorded</span></div></div>
  <section><p class="lbl">Picture</p><div class="stim">${p.scene}</div></section>
  <section><p class="lbl">Tester reads</p><div class="script">${esc(p.story)}</div></section>
  <section><p class="lbl">Tester asks</p><ol class="prompts">${p.prompts.map(x=>`<li>“${esc(x)}”</li>`).join('')}</ol></section>
  <section class="rub"><p class="lbl">Scoring</p><div class="scroll"><table><thead><tr><th>Score</th><th>The answer</th><th>Example</th></tr></thead>
  <tbody>${p.rubric.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div></section>
  </article>`;
}

const idx=document.getElementById('index'), pk=document.getElementById('picker');
const grpHTML=(g,label)=>`<div><h3>${label}</h3><ol>${VIEWS.map((v,k)=>v.grp===g?`<li><button type="button" data-k="${k}"><span>${v.num}</span><span>${esc(v.title)}</span></button></li>`:'').join('')}</ol></div>`;
idx.innerHTML=grpHTML('g','Group test')+grpHTML('o','One-on-one');
pk.innerHTML=`<optgroup label="Group test">${VIEWS.map((v,k)=>v.grp==='g'?`<option value="${k}">${v.num}. ${esc(v.title)}</option>`:'').join('')}</optgroup><optgroup label="One-on-one">${VIEWS.map((v,k)=>v.grp==='o'?`<option value="${k}">${v.num}. ${esc(v.title)}</option>`:'').join('')}</optgroup>`;

let cur=0;
function go(k,push){
  cur=Math.max(0,Math.min(VIEWS.length-1,k)); const v=VIEWS[cur];
  document.getElementById('sheet').innerHTML=v.id==='intro'?renderIntro():v.grp==='g'?renderItem(v):renderPrompt(v);
  idx.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.k===cur)));
  pk.value=String(cur);
  const pv=VIEWS[cur-1], nx=VIEWS[cur+1], bp=document.getElementById('prev'), bn=document.getElementById('next');
  bp.disabled=!pv; bn.disabled=!nx;
  if(pv) bp.querySelector('b').textContent=`${pv.num}. ${pv.title}`;
  if(nx) bn.querySelector('b').textContent=`${nx.num}. ${nx.title}`;
  if(push){try{history.replaceState(null,'','#'+v.id)}catch(e){}}
  window.scrollTo(0,0);
}
idx.addEventListener('click',e=>{const b=e.target.closest('button[data-k]'); if(b) go(+b.dataset.k,true)});
pk.addEventListener('change',()=>go(+pk.value,true));
document.getElementById('prev').addEventListener('click',()=>go(cur-1,true));
document.getElementById('next').addEventListener('click',()=>go(cur+1,true));
document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea'))return; if(e.key==='ArrowRight')go(cur+1,true); if(e.key==='ArrowLeft')go(cur-1,true)});
const ab=document.getElementById('ans');
ab.addEventListener('click',()=>{const on=ab.getAttribute('aria-pressed')!=='true'; ab.setAttribute('aria-pressed',String(on)); document.body.classList.toggle('ans',on)});
const start=VIEWS.findIndex(v=>v.id===(location.hash||'').slice(1));
go(start>=0?start:0,false);
</script>

</body></html>
